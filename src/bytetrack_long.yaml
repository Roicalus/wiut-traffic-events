# Like the default bytetrack.yaml, but with track_buffer increased several times over,
# so the tracker does not lose IDs of cars queued at a traffic light
# that are periodically occluded by neighbouring cars.
tracker_type: bytetrack
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 200
match_thresh: 0.8
fuse_score: True
